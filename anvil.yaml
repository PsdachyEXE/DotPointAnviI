metadata: {description: 'Assessment tracker for VCE students (Anvil port of C:\Coding\DotPoint)', title: DotPoint}
native_deps:
  head_html: |
    <style>
    /* ---- DotPoint light theme (SAT 5 §2 design language) ---- */
    body { background:#f5f7fa !important; color:#1f2933;
           font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif; }
    a, .anvil-component a { color:#2f6fd0; }

    /* Buttons: role='primary' (blue CTA) / role='secondary' (ghost) */
    .anvil-role-primary button {
      background:#2f6fd0 !important; color:#ffffff !important;
      border:1px solid #2f6fd0 !important; border-radius:8px !important;
      padding:6px 18px !important; font-weight:600 !important; }
    .anvil-role-primary button:hover { background:#245ab0 !important; }
    .anvil-role-secondary button {
      background:#ffffff !important; color:#374151 !important;
      border:1px solid #d1d5db !important; border-radius:8px !important;
      padding:5px 14px !important; }
    .anvil-role-secondary button:hover { background:#f3f4f6 !important; }

    /* Headings: role='heading' */
    .anvil-role-heading, .anvil-role-heading * {
      font-weight:700 !important; color:#111827; }

    /* Cards: role='card' — white surface, soft border + shadow */
    .anvil-role-card {
      background:#ffffff; border:1px solid #e5e7eb; border-radius:10px;
      box-shadow:0 1px 3px rgba(16,24,40,.06);
      padding:12px 16px !important; margin:8px 0 !important; }

    /* Top navigation bar: role='topbar' */
    .anvil-role-topbar {
      background:#ffffff; border-bottom:1px solid #e5e7eb;
      padding:10px 16px !important; margin-bottom:10px !important;
      box-shadow:0 1px 2px rgba(16,24,40,.04); }

    /* Inputs (TextBox / TextArea / DropDown / DatePicker) */
    .form-control, select.form-control, textarea.form-control {
      border-radius:8px !important; border:1px solid #d1d5db !important;
      box-shadow:none !important; }
    .form-control:focus { border-color:#2f6fd0 !important;
      box-shadow:0 0 0 3px rgba(47,111,208,.15) !important; }
    </style>
package_name: DotPoint
runtime_options:
  client_version: '3'
  server_version: python3-full
  version: 2
scheduled_tasks: []
services:
- client_config: {}
  server_config: {auto_create_missing_columns: false}
  source: /runtime/services/tables.yml
- client_config: {allow_remembered_logins: true, allow_signup: true, allow_signups: true, confirm_email: false, enable_automatically: true, enable_password_reset_email: true, n_password_failures: 10, remember_me_days: 7, require_secure_passwords: true, share_login_status: true, use_email: true, use_mfa: false, use_token: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
startup: {module: Main, type: form}
